[tox]
envlist =
    lint,
    py311,py312,py313,py314,py315,pypy311,
    py311-pyramid19,
    py311-pyramid110,
    docs,
    coverage
isolated_build = True

[testenv]
deps =
    # oldest supported pyramid, it added the execution policy api
    pyramid19: pyramid <= 1.9.99
    # last 1.x release, before 2.0 removed deprecated apis
    pyramid110: pyramid <= 1.10.99
    # pyramid < 2.1 imports pkg_resources, removed in setuptools 82
    pyramid19,pyramid110: setuptools < 82
commands =
    python --version
    pytest \
    cover: --cov \
        {posargs:}
dependency_groups =
    testing
setenv =
    COVERAGE_FILE=.coverage.{envname}

[testenv:coverage]
skip_install = True
commands =
    coverage combine
    coverage xml
    coverage report --fail-under=100
deps =
    coverage
dependency_groups =
setenv =
    COVERAGE_FILE=.coverage
depends = py314-cover

[testenv:lint]
skip_install = True
commands =
    isort --check-only --df src/pyramid_retry tests
    black --check --diff src/pyramid_retry tests
    # flake8 src/pyramid_retry tests
    check-manifest
    # build sdist/wheel
    python -m build .
    twine check dist/*
dependency_groups =
    lint

[testenv:docs]
allowlist_externals = make
commands =
    make -C docs html BUILDDIR={envdir} SPHINXOPTS="-W -E"
dependency_groups =
    docs

[testenv:format]
skip_install = true
commands =
    isort src/pyramid_retry tests
    black src/pyramid_retry tests
dependency_groups =
    lint

[testenv:build]
skip_install = true
commands =
    # clean up build/ and dist/ folders
    python -c 'import shutil; shutil.rmtree("build", ignore_errors=True)'
    # Make sure we aren't forgetting anything
    check-manifest
    # build sdist/wheel
    python -m build .
    # Verify all is well
    twine check dist/*
dependency_groups =
    lint
